services:
  - type: web
    name: n8n
    env: docker
    plan: free
    region: oregon
    autoDeploy: true
    dockerImage: n8nio/n8n:latest
    envVars:
      - key: N8N_PORT
        value: "5678"
      - key: N8N_HOST
        value: "0.0.0.0"
      - key: GENERIC_TIMEZONE
        value: "Asia/Tashkent"
